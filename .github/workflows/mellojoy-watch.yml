name: mellojoy-watch

on:
  schedule:
    # GitHub側の定時実行は数十分単位で遅延することがあるため、
    # 監視対象の12:00より大幅に早い時刻(9:00, 9:30 JST)に起動し、
    # スクリプト内部で11:59まで待機してから実際の監視を始める。
    - cron: "0 0 * * *"
    - cron: "30 0 * * *"
  workflow_dispatch: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python watch_and_notify.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
